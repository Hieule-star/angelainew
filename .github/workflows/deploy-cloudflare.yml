name: Deploy to Cloudflare Worker

# Build ANGEL AI MỚI (TanStack Start + Nitro, cloudflare-module preset)
# and deploy it as a Cloudflare Worker via Wrangler.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN  -> Cloudflare API token with "Workers Scripts: Edit"
#   CLOUDFLARE_ACCOUNT_ID -> Your Cloudflare account ID

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: cloudflare-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml