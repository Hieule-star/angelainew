name: Supabase Keepalive

# Supabase Free tạm dừng project sau 7 ngày không hoạt động.
# Workflow này ping database mỗi 3 ngày để giữ project luôn "thức".

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive endpoint
        env:
          KEEPALIVE_URL: ${{ secrets.KEEPALIVE_URL }}
          KEEPALIVE_SECRET: ${{ secrets.KEEPALIVE_SECRET }}
        run: |
          if [ -z "$KEEPALIVE_URL" ] || [ -z "$KEEPALIVE_SECRET" ]; then
            echo "Missing KEEPALIVE_URL or KEEPALIVE_SECRET repository secret."
            exit 1
          fi
          echo "URL: $KEEPALIVE_URL"
          echo "Secret length: ${#KEEPALIVE_SECRET}"
          case "$KEEPALIVE_SECRET" in
            *[[:space:]]*) echo "WARNING: secret contains whitespace/newline" ;;
          esac

          for attempt in 1 2 3; do
            echo "----- Attempt $attempt -----"
            status=$(curl --silent --show-error --max-time 60 \
              -o /tmp/keepalive-body.txt -w '%{http_code}' \
              -H "x-keepalive-secret: $KEEPALIVE_SECRET" \
              "$KEEPALIVE_URL?source=github-action") || status="000"
            echo "HTTP status: $status"
            echo "Response body:"
            cat /tmp/keepalive-body.txt || true
            echo ""
            if [ "$status" = "200" ]; then
              echo "Keepalive ping succeeded on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt failed with status $status."
            [ "$attempt" != "3" ] && sleep 30
          done
          echo "Keepalive ping failed after 3 attempts (last status: $status)."
          exit 1
