# Cloudflare Worker config for ANGEL AI MỚI
# Deployed via GitHub Actions (deploy-cloudflare.yml) using Wrangler.
# `main` points to the Worker entry bundled by Nitro (vite build).

name = "angel-ai-new"
main = "dist/server/index.mjs"
compatibility_date = "2026-08-29"
compatibility_flags = ["nodejs_compat"]
no_bundle = true

# Serve the static client assets built by Vite/Nitro.
[assets]
binding = "ASSETS"
directory = "dist/client"

[observability]
enabled = true